<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project Keepalive</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #10131a; color: #f4f6fb; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top right, #243657, #10131a 50%); }
      main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0; }
      h1 { margin-bottom: 8px; font-size: clamp(2rem, 5vw, 3.5rem); }
      .intro { color: #aeb9ce; margin-top: 0; }
      .card { background: rgba(20, 25, 36, .9); border: 1px solid #303b52; border-radius: 18px; padding: 24px; margin-top: 28px; box-shadow: 0 20px 60px #0004; }
      form { display: grid; grid-template-columns: 1fr 1.4fr .8fr 1fr auto; gap: 12px; align-items: end; }
      label { display: grid; gap: 7px; color: #b7c3d8; font-size: .9rem; }
      input, select, button { border: 1px solid #45526d; border-radius: 10px; padding: 12px; font: inherit; }
      input, select { color: #f4f6fb; background: #151b27; }
      button { color: #07111e; background: #76d6b0; border: 0; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .65; }
      #message { min-height: 1.5em; color: #9de0c3; }
      #message.error { color: #ffaaa8; }
      ul { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
      li { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding: 15px; border: 1px solid #303b52; border-radius: 12px; background: #151b27; }
      li strong { display: block; }
      li a { color: #8fc8ff; overflow-wrap: anywhere; }
      .tag { color: #aeb9ce; font-size: .85rem; white-space: nowrap; }
      .empty { color: #aeb9ce; }
      @media (max-width: 900px) { form { grid-template-columns: 1fr 1fr; } }
      @media (max-width: 560px) { form { grid-template-columns: 1fr; } li { display: grid; } .tag { white-space: normal; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Project Keepalive</h1>
      <p class="intro">Add deployed demos here. Each saved project is committed to <code>projects.json</code> and will be checked by GitHub Actions.</p>
      <section class="card">
        <form id="project-form">
          <label>Project name<input id="name" name="name" required placeholder="My demo" /></label>
          <label>Project URL<input id="url" name="url" type="url" required placeholder="https://..." /></label>
          <label>Type<select id="type" name="type"><option value="streamlit">Streamlit</option><option value="huggingface">Hugging Face</option></select></label>
          <label>Admin key<input id="admin-key" name="adminKey" type="password" required autocomplete="off" /></label>
          <button id="submit" type="submit">Add project</button>
        </form>
        <p id="message" role="status"></p>
      </section>
      <section class="card">
        <h2>Configured projects</h2>
        <ul id="projects"><li class="empty">Enter your admin key to load projects.</li></ul>
      </section>
    </main>
    <script>
      const form = document.querySelector('#project-form');
      const list = document.querySelector('#projects');
      const message = document.querySelector('#message');
      const submit = document.querySelector('#submit');
      const key = () => document.querySelector('#admin-key').value;
      function showMessage(text, isError = false) { message.textContent = text; message.className = isError ? 'error' : ''; }
      function render(projects) {
        list.replaceChildren();
        if (!projects.length) { const empty = document.createElement('li'); empty.className = 'empty'; empty.textContent = 'No projects configured yet.'; list.append(empty); return; }
        for (const project of projects) {
          const item = document.createElement('li'); const details = document.createElement('div'); const name = document.createElement('strong');
          name.textContent = project.name; const link = document.createElement('a'); link.href = project.url; link.target = '_blank'; link.rel = 'noreferrer'; link.textContent = project.url;
          details.append(name, link); const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = project.type === 'huggingface' ? 'Hugging Face' : 'Streamlit'; item.append(details, tag); list.append(item);
        }
      }
      async function loadProjects() {
        if (!key()) return;
        try { const response = await fetch('/api/projects', { headers: { 'x-admin-key': key() } }); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Could not load projects.'); render(data.projects); showMessage(''); }
        catch (error) { showMessage(error.message, true); }
      }
      document.querySelector('#admin-key').addEventListener('change', loadProjects);
      form.addEventListener('submit', async (event) => {
        event.preventDefault(); submit.disabled = true; showMessage('Saving project…');
        const payload = { name: document.querySelector('#name').value, url: document.querySelector('#url').value, type: document.querySelector('#type').value };
        try { const response = await fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-key': key() }, body: JSON.stringify(payload) }); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Could not save project.'); render(data.projects); document.querySelector('#name').value = ''; document.querySelector('#url').value = ''; showMessage('Saved and committed to projects.json.'); }
        catch (error) { showMessage(error.message, true); } finally { submit.disabled = false; }
      });
    </script>
  </body>
</html>
